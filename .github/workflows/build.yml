name: Build Frame Window Counter

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android32
            target: Android32
          - name: Android64
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Android Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.config.target }}
          android-min-sdk: 23
          combine: true
          use-lto: true

  package:
    name: Package Android32 + Android64
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine Android builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          cli: latest
          delete-artifacts: true
          optimize-pngs: true
          zstd: false

      - name: Verify final Geode package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${{ steps.combine.outputs.build-output }}"/*.geode)
          test "${#files[@]}" -ge 1
          for file in "${files[@]}"; do
            echo "Checking $file"
            unzip -l "$file"
            unzip -l "$file" | grep -Fq 'c0nscious.frame_window.android32.so'
            unzip -l "$file" | grep -Fq 'c0nscious.frame_window.android64.so'
          done

      - name: Upload final .geode
        uses: actions/upload-artifact@v7
        with:
          name: frame-window-counter-android-1.1.4
          path: ${{ steps.combine.outputs.build-output }}/*.geode
          if-no-files-found: error
